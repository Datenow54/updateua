<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite UA Generator - Real Device 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap');

        body {
            background: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .neon-text {
            font-family: 'Orbitron', sans-serif;
            color: #00f2ff;
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.7);
        }

        .custom-select {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .custom-select:focus {
            border-color: #00f2ff;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
            color: #fff;
        }

        .btn-glow {
            background: linear-gradient(90deg, #00f2ff, #0062ff);
            box-shadow: 0 0 20px rgba(0, 98, 255, 0.4);
            transition: 0.4s;
        }

        .btn-glow:hover {
            box-shadow: 0 0 35px rgba(0, 242, 255, 0.8);
            transform: scale(1.02);
        }

        .ua-card {
            border-left: 4px solid #00f2ff;
            background: #0f172a;
            animation: slideIn 0.5s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2ff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-5xl glass rounded-3xl p-8 md:p-12 relative overflow-hidden">
        <!-- Floating Circles Animation -->
        <div class="absolute -top-24 -left-24 w-64 h-64 bg-cyan-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-64 h-64 bg-blue-600/10 rounded-full blur-3xl"></div>

        <div class="relative z-10 text-center mb-10">
            <h1 class="text-4xl md:text-6xl font-black neon-text mb-4">UA GENERATOR PRO</h1>
            <p class="text-slate-400 tracking-widest text-sm uppercase">100% Undetectable Fingerprint Engine</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Platform -->
            <div>
                <label class="block text-xs font-bold text-cyan-500 mb-2 uppercase">Platform</label>
                <select id="platform" onchange="updateBrowsers()" class="w-full custom-select p-4 rounded-xl focus:outline-none">
                    <option value="android">Android Mobile</option>
                    <option value="iphone">iPhone / iOS</option>
                    <option value="ipad">iPad / iPadOS</option>
                    <option value="windows">Windows Desktop</option>
                    <option value="linux">Linux System</option>
                </select>
            </div>

            <!-- Browser/App -->
            <div>
                <label class="block text-xs font-bold text-cyan-500 mb-2 uppercase">Browser or App</label>
                <select id="browserApp" class="w-full custom-select p-4 rounded-xl focus:outline-none">
                    <!-- Options injected by JS -->
                </select>
            </div>

            <!-- Language -->
            <div>
                <label class="block text-xs font-bold text-cyan-500 mb-2 uppercase">System Language</label>
                <select id="locale" class="w-full custom-select p-4 rounded-xl focus:outline-none">
                    <option value="en-US">English (United States)</option>
                    <option value="bn-BD">Bengali (Bangladesh)</option>
                    <option value="en-GB">English (United Kingdom)</option>
                    <option value="hi-IN">Hindi (India)</option>
                    <option value="ar-SA">Arabic (Saudi Arabia)</option>
                    <option value="fr-FR">French (France)</option>
                    <option value="de-DE">German (Germany)</option>
                    <option value="pt-BR">Portuguese (Brazil)</option>
                    <option value="ru-RU">Russian (Russia)</option>
                    <option value="ja-JP">Japanese (Japan)</option>
                    <option value="zh-CN">Chinese (China)</option>
                </select>
            </div>
        </div>

        <div class="flex items-center justify-between mb-8 px-2">
            <label class="flex items-center space-x-3 cursor-pointer">
                <input type="checkbox" id="modernModels" class="w-5 h-5 accent-cyan-400">
                <span class="text-slate-300 text-sm">Force Latest Models (iPhone 16/S26)</span>
            </label>
            <div class="text-slate-500 text-xs italic">Version Range: 2024 - 2026 Compatible</div>
        </div>

        <button onclick="generateEliteUA()" class="w-full btn-glow py-5 rounded-2xl text-white font-bold text-xl uppercase tracking-widest flex justify-center items-center space-x-4">
            <span id="btnText">Generate 100% Real UA</span>
            <div id="loader" class="hidden w-6 h-6 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
        </button>

        <div id="results" class="mt-10 space-y-4">
            <!-- Output -->
        </div>
    </div>

    <script>
        const androidModels = ["SM-S928B", "SM-G998B", "Pixel 8 Pro", "Pixel 9 Pro", "Xiaomi 14 Ultra", "OnePlus 12", "SM-A546B", "CPH2581", "RMX3851"];
        const appleModels = ["iPhone 16 Pro Max", "iPhone 15 Pro", "iPhone 14 Pro", "iPhone 13 Pro"];
        const ipadModels = ["iPad16,3", "iPad14,5", "iPad13,8"];

        const appData = {
            android: ["Chrome", "Firefox", "Facebook", "Instagram", "Reddit", "Snapchat", "TikTok"],
            iphone: ["Chrome", "Firefox", "Safari", "Facebook", "Instagram", "Reddit", "Snapchat", "TikTok"],
            ipad: ["Chrome", "Firefox", "Safari", "Facebook", "Instagram"],
            windows: ["Chrome", "Firefox", "Edge"],
            linux: ["Chrome", "Firefox"]
        };

        function updateBrowsers() {
            const platform = document.getElementById('platform').value;
            const browserSelect = document.getElementById('browserApp');
            browserSelect.innerHTML = '';
            appData[platform].forEach(app => {
                const opt = document.createElement('option');
                opt.value = app.toLowerCase();
                opt.textContent = app;
                browserSelect.appendChild(opt);
            });
        }

        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function generateEliteUA() {
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const platform = document.getElementById('platform').value;
            const app = document.getElementById('browserApp').value;
            const locale = document.getElementById('locale').value;

            btnText.textContent = "Processing Algorithm...";
            loader.classList.remove('hidden');
            results.innerHTML = '';

            setTimeout(() => {
                for (let i = 0; i < 5; i++) {
                    let ua = "";
                    const chromeV = rand(133, 147);
                    const firefoxV = rand(133, 150);
                    const andV = rand(11, 15);
                    const iosV = `1${rand(7, 9)}_${rand(1, 5)}`;
                    const model = androidModels[rand(0, androidModels.length - 1)];
                    const iModel = appleModels[rand(0, appleModels.length - 1)];

                    if (platform === 'android') {
                        if (app === 'chrome') {
                            ua = `Mozilla/5.0 (Linux; Android ${andV}; ${model}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeV}.0.${rand(1000, 9999)}.${rand(100, 200)} Mobile Safari/537.36`;
                        } else if (app === 'firefox') {
                            ua = `Mozilla/5.0 (Android ${andV}; Mobile; rv:${firefoxV}.0) Gecko/${firefoxV}.0 Firefox/${firefoxV}.0`;
                        } else if (app === 'facebook') {
                            ua = `[FBAN/FB4A;FBAV/${rand(492, 560)}.0.0.${rand(10, 99)};FBBV/${rand(500000000, 600000000)};FBDM/{density=3.0,width=1080,height=2400};FBLC/${locale};FBCR/WIFI;FBMF/Samsung;FBBD/Samsung;FBPN/com.facebook.katana;FBDV/${model};FBSV/${andV};FBOP/1;FBCA/arm64-v8a:;]`;
                        } else if (app === 'instagram') {
                            ua = `Instagram ${rand(373, 430)}.0.0.${rand(10, 68)} Android (${rand(30, 35)}/${andV}; 480dpi; 1080x2400; Samsung; ${model}; q2q; qcom; ${locale})`;
                        } else if (app === 'reddit') {
                            ua = `Reddit/Version 202${rand(4, 6)}.${rand(2, 19)}.0/Android/${andV}`;
                        } else if (app === 'snapchat') {
                            ua = `Snapchat/13.${rand(74, 91)}.0.${rand(1, 44)} (${model}; Android ${andV}; v8a; ${locale})`;
                        } else if (app === 'tiktok') {
                            ua = `com.zhiliaoapp.musically/${rand(34, 45)}.2.42 (Linux; U; Android ${andV}; ${locale}; ${model}; Build/RP1A.${rand(100000, 999999)}; Cronet/58.0.2991.0)`;
                        }
                    } 
                    else if (platform === 'iphone' || platform === 'ipad') {
                        const devName = platform === 'iphone' ? iModel : ipadModels[rand(0, 2)];
                        const osName = platform === 'iphone' ? 'iPhone OS' : 'iPad OS';
                        
                        if (app === 'chrome') {
                            ua = `Mozilla/5.0 (${devName.split(' ')[0]}; CPU ${osName} ${iosV} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) CriOS/${rand(133, 148)}.0.${rand(1000, 6000)}.${rand(100, 150)} Mobile/15E148 Safari/604.1`;
                        } else if (app === 'firefox') {
                            ua = `Mozilla/5.0 (${devName.split(' ')[0]}; CPU ${osName} ${iosV} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) FxiOS/${rand(133, 150)}.0 Mobile/15E148 Safari/605.1.15`;
                        } else if (app === 'facebook') {
                            ua = `[FBAN/FBIOS;FBAV/${rand(473, 561)}.0.0;FBBV/${rand(500000000, 600000000)};FBDM/{density=3.0,width=1170,height=2532};FBLC/${locale};FBCR/WIFI;FBMF/iPhone;FBBD/iPhone;FBPN/com.facebook.Messenger;FBDV/${devName};FBSV/${iosV.replace('_','.')};FBOP/5;FBCS/1]`;
                        } else if (app === 'instagram') {
                            ua = `Instagram ${rand(362, 428)}.0.0.0.121 (iPhone; iOS ${iosV.replace('_','.')}; ${locale}; ${devName}; it_IT; 362428000)`;
                        } else if (app === 'reddit') {
                            ua = `Reddit/${rand(2025, 2026)}.${rand(4, 19)}.1 (iPhone; iOS ${iosV.replace('_','.')}; ${locale})`;
                        } else if (app === 'snapchat') {
                            ua = `Snapchat/13.${rand(68, 91)} (iPhone; iOS ${iosV.replace('_','.')}; Build/13.${rand(60, 90)})`;
                        } else if (app === 'tiktok') {
                            ua = `TikTok ${rand(32, 43)}.1.0 (iPhone; iOS ${iosV.replace('_','.')}; ${locale})`;
                        } else {
                            ua = `Mozilla/5.0 (${devName.split(' ')[0]}; CPU ${osName} ${iosV} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1`;
                        }
                    }
                    else if (platform === 'windows') {
                        if(app === 'chrome') {
                            ua = `Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeV}.0.${rand(1000, 6000)}.${rand(100, 150)} Safari/537.36`;
                        } else {
                            ua = `Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:${firefoxV}.0) Gecko/20100101 Firefox/${firefoxV}.0`;
                        }
                    }
                    else if (platform === 'linux') {
                        ua = `Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeV}.0.0.0 Safari/537.36`;
                    }

                    displayResult(ua);
                }
                btnText.textContent = "Generate 100% Real UA";
                loader.classList.add('hidden');
            }, 1000);
        }

        function displayResult(ua) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'ua-card p-5 rounded-r-2xl relative group cursor-pointer';
            div.onclick = () => copyText(ua, div);
            div.innerHTML = `
                <div class="text-xs text-cyan-400 mb-1 font-bold">REAL-TIME DATA GENERATED:</div>
                <code class="text-slate-300 text-sm break-all font-mono">${ua}</code>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-all text-xs bg-cyan-500 text-white px-2 py-1 rounded">Click to Copy</div>
            `;
            results.appendChild(div);
        }

        function copyText(text, el) {
            navigator.clipboard.writeText(text);
            const original = el.innerHTML;
            el.innerHTML = `<div class="text-green-400 font-bold flex items-center justify-center py-2">✓ COPIED TO CLIPBOARD</div>`;
            setTimeout(() => el.innerHTML = original, 1500);
        }

        // Initialize
        updateBrowsers();
    </script>
</body>
</html>
