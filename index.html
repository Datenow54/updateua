<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100% Real UA Engine - 2026 Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap');

        :root {
            --neon-cyan: #00f2ff;
            --neon-blue: #0062ff;
        }

        body {
            background: #050a15;
            color: #d1d5db;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-container {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(2, 6, 23, 0.95));
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }

        .neon-title {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(to right, #00f2ff, #0062ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.5));
        }

        .input-box {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid #1e293b;
            color: #fff;
            transition: 0.3s;
        }

        .input-box:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            outline: none;
        }

        .gen-btn {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-cyan));
            text-shadow: 0 0 5px #fff;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gen-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.6);
        }

        .ua-result {
            border-left: 3px solid var(--neon-cyan);
            background: rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="w-full max-w-5xl main-container rounded-3xl p-6 md:p-10 relative">
        <div class="absolute top-0 left-0 w-full h-1 shimmer rounded-t-3xl"></div>

        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-5xl font-bold neon-title mb-2">UA MASTER PRO</h1>
            <p class="text-slate-500 uppercase tracking-widest text-xs">100% Real Device Fingerprinting Engine</p>
        </div>

        <!-- Options Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <!-- OS Selection -->
            <div>
                <label class="block text-cyan-500 text-xs font-bold mb-2 uppercase">Platform / OS</label>
                <select id="os" onchange="updateApps()" class="w-full input-box p-3 rounded-xl cursor-pointer">
                    <option value="android">Android Mobile</option>
                    <option value="iphone">iPhone (iOS)</option>
                    <option value="ipad">iPad (iPadOS)</option>
                    <option value="windows">Windows PC</option>
                    <option value="linux">Linux Desktop</option>
                </select>
            </div>

            <!-- App Selection -->
            <div>
                <label class="block text-cyan-500 text-xs font-bold mb-2 uppercase">Browser / App</label>
                <select id="app" class="w-full input-box p-3 rounded-xl cursor-pointer">
                    <!-- Dynamic -->
                </select>
            </div>

            <!-- Country Language -->
            <div>
                <label class="block text-cyan-500 text-xs font-bold mb-2 uppercase">System Language</label>
                <select id="lang" class="w-full input-box p-3 rounded-xl cursor-pointer">
                    <option value="en-US">English (USA)</option>
                    <option value="bn-BD">Bengali (BD)</option>
                    <option value="en-GB">English (UK)</option>
                    <option value="hi-IN">Hindi (India)</option>
                    <option value="ru-RU">Russian (Russia)</option>
                    <option value="ar-SA">Arabic (Saudi)</option>
                    <option value="fr-FR">French (France)</option>
                    <option value="ja-JP">Japanese (Japan)</option>
                </select>
            </div>

            <!-- Quantity -->
            <div>
                <label class="block text-cyan-500 text-xs font-bold mb-2 uppercase">Quantity</label>
                <input type="number" id="qty" value="5" min="1" max="100" class="w-full input-box p-3 rounded-xl">
            </div>
        </div>

        <button onclick="generateRealUA()" class="w-full gen-btn py-4 rounded-2xl text-white font-bold text-lg flex justify-center items-center gap-3">
            <span>GENERATE REAL USER-AGENTS</span>
            <div id="spinner" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
        </button>

        <!-- Result Container -->
        <div id="results" class="mt-8 space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
            <!-- Results will appear here -->
        </div>
    </div>

    <script>
        const dataSet = {
            android: {
                models: ["SM-S928B", "SM-G998B", "Pixel 8 Pro", "Pixel 9 Pro", "Xiaomi 14 Ultra", "OnePlus 12", "SM-A546B"],
                apps: ["Chrome", "Firefox", "Facebook", "Instagram", "Reddit", "Snapchat", "TikTok"]
            },
            iphone: {
                models: ["iPhone 16 Pro Max", "iPhone 15 Pro", "iPhone 14 Pro", "iPhone 13 Pro"],
                apps: ["Safari", "Chrome", "Firefox", "Facebook", "Instagram", "Reddit", "Snapchat", "TikTok"]
            },
            ipad: {
                models: ["iPad16,3", "iPad14,5", "iPad13,8"],
                apps: ["Safari", "Chrome", "Firefox", "Facebook", "Instagram"]
            },
            windows: {
                models: ["Win64; x64"],
                apps: ["Chrome", "Firefox", "Edge"]
            },
            linux: {
                models: ["X11; Linux x86_64"],
                apps: ["Chrome", "Firefox"]
            }
        };

        function updateApps() {
            const os = document.getElementById('os').value;
            const appSelect = document.getElementById('app');
            appSelect.innerHTML = '';
            dataSet[os].apps.forEach(app => {
                const opt = document.createElement('option');
                opt.value = app.toLowerCase();
                opt.textContent = app;
                appSelect.appendChild(opt);
            });
        }

        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function generateRealUA() {
            const results = document.getElementById('results');
            const os = document.getElementById('os').value;
            const app = document.getElementById('app').value;
            const lang = document.getElementById('lang').value;
            const qty = document.getElementById('qty').value;
            const spinner = document.getElementById('spinner');

            spinner.classList.remove('hidden');
            results.innerHTML = '';

            setTimeout(() => {
                for(let i=0; i<qty; i++) {
                    let ua = "";
                    const model = dataSet[os].models[rand(0, dataSet[os].models.length - 1)];
                    const chromeV = `${rand(133, 147)}.0.${rand(6000, 6900)}.${rand(100, 150)}`;
                    const firefoxV = `${rand(133, 150)}.0`;
                    const andV = rand(11, 15);
                    const iosV = `1${rand(7, 8)}_${rand(1, 6)}`;

                    if(os === 'android') {
                        if(app === 'chrome') {
                            ua = `Mozilla/5.0 (Linux; Android ${andV}; ${model}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeV} Mobile Safari/537.36`;
                        } else if(app === 'firefox') {
                            ua = `Mozilla/5.0 (Android ${andV}; Mobile; rv:${firefoxV}) Gecko/${firefoxV} Firefox/${firefoxV}`;
                        } else if(app === 'facebook') {
                            ua = `[FBAN/FB4A;FBAV/${rand(492, 560)}.0.0.${rand(10, 99)};FBBV/${rand(500000000, 600000000)};FBDM/{density=3.0,width=1080,height=2400};FBLC/${lang.replace('-','_')};FBCR/WIFI;FBMF/Samsung;FBBD/Samsung;FBPN/com.facebook.katana;FBDV/${model};FBSV/${andV};FBOP/1;FBCA/arm64-v8a:;]`;
                        } else if(app === 'instagram') {
                            ua = `Instagram ${rand(373, 430)}.0.0.${rand(10, 68)} Android (${rand(30, 35)}/${andV}; 480dpi; 1080x2400; Samsung; ${model}; qcom; ${lang.replace('-','_')})`;
                        } else if(app === 'reddit') {
                            ua = `Reddit/Version 202${rand(4, 6)}.${rand(2, 19)}.0/Android/${andV}`;
                        } else if(app === 'snapchat') {
                            ua = `Snapchat/13.${rand(74, 91)}.0.${rand(1, 44)} (${model}; Android ${andV}; v8a; ${lang.replace('-','_')})`;
                        } else if(app === 'tiktok') {
                            ua = `com.zhiliaoapp.musically/${rand(34, 45)}.2.42 (Linux; U; Android ${andV}; ${lang}; ${model}; Build/RP1A.${rand(100000, 999999)}; Cronet/58.0.2991.0)`;
                        }
                    } 
                    else if(os === 'iphone' || os === 'ipad') {
                        const platName = os === 'iphone' ? 'iPhone' : 'iPad';
                        const cpuName = os === 'iphone' ? 'iPhone OS' : 'iPad OS';

                        if(app === 'chrome') {
                            ua = `Mozilla/5.0 (${platName}; CPU ${cpuName} ${iosV} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) CriOS/${rand(133, 148)}.0.${rand(6000, 6900)} Mobile/15E148 Safari/604.1`;
                        } else if(app === 'firefox') {
                            ua = `Mozilla/5.0 (${platName}; CPU ${cpuName} ${iosV} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) FxiOS/${firefoxV} Mobile/15E148 Safari/605.1.15`;
                        } else if(app === 'facebook') {
                            ua = `[FBAN/FBIOS;FBAV/${rand(473, 561)}.0.0;FBBV/${rand(500000000, 600000000)};FBLC/${lang.replace('-','_')};FBDV/${model};FBSV/${iosV.replace('_','.')};FBOP/5]`;
                        } else if(app === 'instagram') {
                            ua = `Instagram ${rand(362, 428)}.0.0.0.121 (iPhone; iOS ${iosV.replace('_','.')}; ${lang.replace('-','_')}; ${model}; it_IT; 362428000)`;
                        } else if(app === 'tiktok') {
                            ua = `TikTok ${rand(32, 43)}.1.0 (${platName}; iOS ${iosV.replace('_','.')}; ${lang})`;
                        } else {
                            ua = `Mozilla/5.0 (${platName}; CPU ${cpuName} ${iosV} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/${rand(16, 18)}.0 Mobile/15E148 Safari/604.1`;
                        }
                    }
                    else if(os === 'windows') {
                        if(app === 'firefox') {
                            ua = `Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:${firefoxV}) Gecko/20100101 Firefox/${firefoxV}`;
                        } else {
                            ua = `Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chromeV} Safari/537.36 ${app === 'edge' ? 'Edg/' + chromeV : ''}`;
                        }
                    }

                    renderUA(ua);
                }
                spinner.classList.add('hidden');
            }, 800);
        }

        function renderUA(ua) {
            const container = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'ua-result p-4 rounded-r-xl group relative cursor-pointer hover:bg-white/5 transition-all';
            div.onclick = () => copyUA(ua, div);
            div.innerHTML = `
                <p class="text-[10px] text-cyan-500 font-bold mb-1 tracking-tighter">DATA_STREAMS_OK</p>
                <code class="text-xs md:text-sm text-slate-300 break-all leading-relaxed">${ua}</code>
                <div class="absolute right-3 top-3 opacity-0 group-hover:opacity-100 transition-opacity">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
            `;
            container.appendChild(div);
        }

        function copyUA(text, el) {
            navigator.clipboard.writeText(text);
            const original = el.innerHTML;
            el.innerHTML = `<p class="text-green-400 font-bold text-center py-2 animate-pulse">✓ COPIED TO CLIPBOARD</p>`;
            setTimeout(() => { el.innerHTML = original; }, 1000);
        }

        // Init
        updateApps();
    </script>
</body>
</html>
