<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10000% Real UA Engine - Pro Stealth 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            background: #020617;
            color: #f1f5f9;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
        }

        .neo-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #00f2ff33;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .glitch-header {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(90deg, #00f2ff, #0062ff, #00f2ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .btn-gen {
            background: linear-gradient(45deg, #0062ff, #00f2ff);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-gen:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.6);
        }

        .ua-item {
            border-left: 4px solid #00f2ff;
            background: #000;
            animation: slideUp 0.4s ease forwards;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        select, input {
            background: #1e293b !important;
            border: 1px solid #334155 !important;
            color: #fff !important;
            outline: none !important;
        }

        select:focus { border-color: #00f2ff !important; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="max-w-6xl w-full neo-card rounded-[2rem] p-8 md:p-12">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-6xl font-black glitch-header mb-3">ULTIMATE UA ENGINE</h1>
            <p class="text-cyan-500 uppercase tracking-[0.4em] text-[10px]">Undetectable Social Media Fingerprints</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div>
                <label class="text-xs text-slate-500 mb-2 block font-bold">PLATFORM</label>
                <select id="platform" onchange="loadApps()" class="w-full p-4 rounded-xl cursor-pointer">
                    <option value="android">Android System</option>
                    <option value="iphone">iPhone / iPad</option>
                    <option value="windows">Windows OS</option>
                </select>
            </div>

            <div>
                <label class="text-xs text-slate-500 mb-2 block font-bold">APPLICATION / BROWSER</label>
                <select id="app" class="w-full p-4 rounded-xl cursor-pointer"></select>
            </div>

            <div>
                <label class="text-xs text-slate-500 mb-2 block font-bold">REGION (LOCALE)</label>
                <select id="locale" class="w-full p-4 rounded-xl cursor-pointer">
                    <option value="en_US">United States (en_US)</option>
                    <option value="en_GB">United Kingdom (en_GB)</option>
                    <option value="bn_BD">Bangladesh (bn_BD)</option>
                    <option value="hi_IN">India (hi_IN)</option>
                    <option value="ar_SA">Saudi Arabia (ar_SA)</option>
                </select>
            </div>

            <div>
                <label class="text-xs text-slate-500 mb-2 block font-bold">QUANTITY</label>
                <input type="number" id="qty" value="5" class="w-full p-4 rounded-xl">
            </div>
        </div>

        <button onclick="generateStealthUA()" class="w-full btn-gen py-5 rounded-2xl text-white font-black text-xl tracking-widest flex items-center justify-center gap-4">
            GENERATE 10000% REAL UA
            <div id="loader" class="hidden w-6 h-6 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
        </button>

        <div id="output" class="mt-10 space-y-4 max-h-[500px] overflow-y-auto pr-2">
            <!-- Results injected here -->
        </div>
    </div>

    <script>
        const andModels = [
            {m: "24129PN0CC", b: "Xiaomi", build: "UKQ1.240616.181"},
            {m: "SM-S928B", b: "Samsung", build: "UP1A.231005.007"},
            {m: "Pixel 9 Pro", b: "Google", build: "AD1A.240505.001"},
            {m: "SM-G998B", b: "Samsung", build: "TP1A.220624.014"},
            {m: "Xiaomi 14 Ultra", b: "Xiaomi", build: "UKQ1.230804.001"}
        ];

        const iosModels = [
            {m: "iPhone16,1", b: "iPhone", v: "18_1"},
            {m: "iPhone15,3", b: "iPhone", v: "17_5_1"},
            {m: "iPhone14,2", b: "iPhone", v: "16_6"},
            {m: "iPad16,3", b: "iPad", v: "18_0"}
        ];

        const carriers = ["Jio", "Grameenphone", "T-Mobile", "Verizon", "AT&T", "Vodafone"];

        function loadApps() {
            const p = document.getElementById('platform').value;
            const appSel = document.getElementById('app');
            appSel.innerHTML = '';
            const apps = p === 'iphone' ? ["Facebook", "Instagram", "Reddit", "Snapchat", "TikTok", "Chrome", "Firefox"] : ["Facebook", "Instagram", "Reddit", "Snapchat", "TikTok", "Chrome", "Firefox"];
            apps.forEach(a => appSel.innerHTML += `<option value="${a.toLowerCase()}">${a}</option>`);
        }

        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function generateStealthUA() {
            const output = document.getElementById('output');
            const platform = document.getElementById('platform').value;
            const app = document.getElementById('app').value;
            const locale = document.getElementById('locale').value;
            const qty = document.getElementById('qty').value;
            const loader = document.getElementById('loader');

            loader.classList.remove('hidden');
            output.innerHTML = '';

            setTimeout(() => {
                for (let i = 0; i < qty; i++) {
                    let ua = "";
                    const chV = `${rand(133, 147)}.0.${rand(6000, 6900)}.${rand(100, 150)}`;
                    const carrier = carriers[rand(0, carriers.length - 1)];

                    if (platform === 'android') {
                        const dev = andModels[rand(0, andModels.length - 1)];
                        const andV = rand(11, 15);
                        
                        if (app === 'facebook') {
                            const fbV = `${rand(492, 560)}.0.0.${rand(10, 60)}.${rand(100, 150)}`;
                            const fbbv = rand(600000000, 750000000);
                            ua = `Mozilla/5.0 (Linux; Android ${andV}; ${dev.m} Build/${dev.build}; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/${chV} Mobile Safari/537.36 [FBAN/FB4A;FBAV/${fbV};FBBV/${fbbv};FBDV/${dev.m};FBMD/${dev.b};FBSN/Android;FBSV/${andV};FBSS/3.0;FBCR/${carrier};FBLC/${locale};FBOP/19;FBRV/${fbbv + rand(1000, 5000)}]`;
                        } else if (app === 'instagram') {
                            ua = `Instagram ${rand(373, 430)}.0.0.${rand(10, 68)} Android (${rand(30, 35)}/${andV}; 480dpi; 1080x2400; ${dev.b}; ${dev.m}; qcom; ${locale})`;
                        } else if (app === 'tiktok') {
                            ua = `com.zhiliaoapp.musically/${rand(34, 45)}.2.42 (Linux; U; Android ${andV}; ${locale.toLowerCase()}; ${dev.m}; Build/${dev.build}; Cronet/58.0.2991.0)`;
                        } else if (app === 'chrome') {
                            ua = `Mozilla/5.0 (Linux; Android ${andV}; ${dev.m}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${chV} Mobile Safari/537.36`;
                        } else if (app === 'reddit') {
                            ua = `Reddit/Version 202${rand(4, 6)}.${rand(2, 19)}.0/Android/${andV}`;
                        } else if (app === 'snapchat') {
                            ua = `Snapchat/13.${rand(74, 91)}.0.${rand(1, 44)} (${dev.m}; Android ${andV}; v8a; ${locale})`;
                        }
                    } 
                    else if (platform === 'iphone') {
                        const dev = iosModels[rand(0, iosModels.length - 1)];
                        const iosV = dev.v.replace('_', '.');

                        if (app === 'facebook') {
                            const fbV = `${rand(473, 561)}.0.0.${rand(10, 50)}.${rand(100, 150)}`;
                            const fbbv = rand(700000000, 800000000);
                            ua = `Mozilla/5.0 (${dev.b}; CPU iPhone OS ${dev.v} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/22B${rand(50, 99)} [FBAN/FBIOS;FBAV/${fbV};FBBV/${fbbv};FBDV/${dev.m};FBMD/iPhone;FBSN/iOS;FBSV/${iosV};FBSS/3;FBCR/${carrier};FBLC/${locale};FBOP/5;FBRV/0]`;
                        } else if (app === 'instagram') {
                            ua = `Instagram ${rand(362, 428)}.0.0.0.121 (iPhone; iOS ${iosV}; ${locale}; ${dev.m}; it_IT; 362428000)`;
                        } else if (app === 'chrome') {
                            ua = `Mozilla/5.0 (iPhone; CPU iPhone OS ${dev.v} like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) CriOS/${rand(133, 148)}.0.${rand(6000, 6900)} Mobile/15E148 Safari/604.1`;
                        } else if (app === 'tiktok') {
                            ua = `TikTok ${rand(32, 43)}.1.0 (iPhone; iOS ${iosV}; ${locale})`;
                        } else if (app === 'snapchat') {
                            ua = `Snapchat/13.${rand(68, 91)}.1.0 (iPhone; iOS ${iosV}; Build/13.${rand(60, 90)})`;
                        } else if (app === 'reddit') {
                            ua = `Reddit/202${rand(5, 6)}.${rand(4, 19)}.1 (iPhone; iOS ${iosV}; ${locale})`;
                        }
                    }

                    render(ua);
                }
                loader.classList.add('hidden');
            }, 800);
        }

        function render(ua) {
            const out = document.getElementById('output');
            const d = document.createElement('div');
            d.className = 'ua-item p-5 rounded-r-2xl group relative cursor-pointer hover:bg-white/5 transition-all mb-4';
            d.onclick = () => {
                navigator.clipboard.writeText(ua);
                const toast = document.createElement('div');
                toast.className = "fixed bottom-5 right-5 bg-cyan-500 text-white px-6 py-2 rounded-full text-xs font-bold shadow-lg animate-bounce";
                toast.innerText = "COPIED TO CLIPBOARD!";
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            };
            d.innerHTML = `<div class="text-[9px] text-cyan-400 font-bold mb-1 tracking-widest">REAL_STREAM_ENCRYPTED</div>
                           <code class="text-xs md:text-sm text-slate-300 break-all leading-relaxed">${ua}</code>`;
            out.appendChild(d);
        }

        loadApps();
    </script>
</body>
</html>
